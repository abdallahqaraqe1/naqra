name: Build and Publish Naqra Release

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Rebuild Windows and Linux too'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch FFmpeg and Build Windows Installers (x64 & arm64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location windows
          $TAG = "autobuild-2026-10-18-13-01"
          $VER = "n8.1.3-18-g46d899d7a0"
          $BASE = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG"
          New-Item -ItemType Directory -Force build/ffmpeg, build/installer | Out-Null

          foreach ($pair in @(@("winarm64", "win-arm64"), @("win64", "win-x64"))) {
            $arch = $pair[0]
            $rid = $pair[1]
            $zip = "build/ffmpeg/ffmpeg-$VER-$arch-gpl-8.1.zip"
            if (-not (Test-Path $zip)) {
              Invoke-WebRequest -Uri "$BASE/ffmpeg-$VER-$arch-gpl-8.1.zip" -OutFile $zip
            }
            New-Item -ItemType Directory -Force "build/ffmpeg/$rid" | Out-Null
            Expand-Archive -Path $zip -DestinationPath "build/ffmpeg/tmp-$rid" -Force
            Get-ChildItem -Path "build/ffmpeg/tmp-$rid" -Recurse -Include "ffmpeg.exe","ffprobe.exe","LICENSE.txt" | ForEach-Object {
              Copy-Item $_.FullName -Destination "build/ffmpeg/$rid/" -Force
            }
            Remove-Item -Recurse -Force "build/ffmpeg/tmp-$rid"
          }

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

          foreach ($arch in @("arm64", "x64")) {
            $out = "build/publish/app-$arch"
            dotnet publish src/Naqra.App/Naqra.App.csproj -f net10.0-windows10.0.22621.0 -c Release -r "win-$arch" --self-contained -p:DebugType=none -o $out
            dotnet publish src/Naqra.Cli/Naqra.Cli.csproj -f net10.0-windows10.0.22621.0 -c Release -r "win-$arch" --self-contained -p:DebugType=none -o $out
            New-Item -ItemType Directory -Force "$out/tools" | Out-Null
            Copy-Item "build/ffmpeg/win-$arch/ffmpeg.exe" "$out/tools/ffmpeg.exe" -Force
            Copy-Item "build/ffmpeg/win-$arch/LICENSE.txt" "$out/tools/ffmpeg-LICENSE.txt" -Force
            & $iscc "/DArch=$arch" "/DAppVersion=1.1.0" "/DSource=..\build\publish\app-$arch" "installer\Naqra.iss"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: windows/build/installer/Naqra-Setup-*.exe

  build-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux packaging tools (squashfs-tools & nfpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          NFPM_URL=$(curl -s https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep browser_download_url | grep 'amd64.deb"' | cut -d '"' -f 4 | head -n 1)
          curl -fsSL -o /tmp/nfpm.deb "$NFPM_URL"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build Linux DEB, RPM, and AppImage packages
        run: |
          sed -i 's/\r$//' linux/tools/*.sh linux/packaging/AppRun linux/packaging/nfpm.yaml linux/packaging/naqra.desktop
          chmod +x linux/tools/*.sh linux/packaging/AppRun
          bash linux/tools/build-packages.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            linux/build/packages/*.deb
            linux/build/packages/*.rpm
            linux/build/packages/*.AppImage

  build-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fetch native dependencies and Build signed Android APK
        run: |
          set -euo pipefail
          sed -i 's/\r$//' android/tools/*.sh android/gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;4.1.2" >/dev/null || true
          bash android/tools/fetch-native.sh
          keytool -genkeypair -v -keystore /tmp/naqra-release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias naqra -storepass naqra123456 -keypass naqra123456 \
            -dname "CN=Abdallah Qaraqe, OU=Naqra, O=Naqra, L=Jerusalem, S=Jerusalem, C=PS"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pnaqra.storeFile=/tmp/naqra-release.jks \
            -Pnaqra.storePassword=naqra123456 \
            -Pnaqra.keyAlias=naqra \
            -Pnaqra.keyPassword=naqra123456 \
            --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Naqra-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: Naqra-Android.apk

  build-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS App and DMG
        run: |
          sed -i '' $'s/\r$//' scripts/*.sh
          chmod +x scripts/*.sh
          zsh scripts/build-app.sh --dmg
          cp build/Naqra-1.1.0.dmg build/Naqra.dmg

      - name: Upload macOS DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/Naqra.dmg
            build/Naqra-1.1.0.dmg

  publish-release:
    if: always()
    needs: [build-windows, build-linux, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Upload all updated assets and SHA-256 checksums to v1.1.0 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 41133095082 -n windows-packages -n linux-packages -D release-assets --repo "${{ github.repository }}"
          gh run download 41134232264 -n android-package -D release-assets --repo "${{ github.repository }}"
          gh run download 41134984612 -n macos-packages -D release-assets --repo "${{ github.repository }}"
          find release-assets -mindepth 2 -type f -exec mv -f {} release-assets/ \;
          find release-assets -mindepth 1 -type d -delete
          ls -lh release-assets/
          gh release upload v1.1.0 release-assets/* --clobber --repo "${{ github.repository }}"
          cd release-assets
          SUMS=$(shasum -a 256 Naqra.dmg Naqra-Setup-x64.exe Naqra-Setup-arm64.exe Naqra-linux-amd64.deb Naqra-linux-arm64.deb Naqra-linux-x86_64.rpm Naqra-linux-aarch64.rpm Naqra-x86_64.AppImage Naqra-aarch64.AppImage Naqra-Android.apk)
          echo "$SUMS"
          python3 -c '
          import subprocess, sys, re
          sums = sys.argv[1].strip()
          body = subprocess.check_output(["gh", "release", "view", "v1.1.0", "--repo", "${{ github.repository }}", "--json", "body", "-q", ".body"], text=True)
          new_body = re.sub(r"(### SHA-256 Checksums\s+```\n).*?(\n```)", r"\g<1>" + sums + r"\g<2>", body, flags=re.S)
          with open("/tmp/release-body.md", "w", encoding="utf-8") as f:
              f.write(new_body)
          subprocess.run(["gh", "release", "edit", "v1.1.0", "--repo", "${{ github.repository }}", "--notes-file", "/tmp/release-body.md"], check=True)
          ' "$SUMS"
